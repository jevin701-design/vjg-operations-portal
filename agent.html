<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VJG Bitácora Agent — Prueba</title>
<style>
:root { --bg:#0d0d0d; --panel:#1a1a1a; --card:#1e1e1e; --text:#f5f5f5; --muted:#a0a0a0; --red:#c8102e; --border:#2a2a2a; --green:#22c55e; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; }
h1 { font-size:22px; margin:0 0 8px; }
h1 span { color:var(--red); }
.sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
.box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
input[type="text"] { width:100%; padding:10px; background:#0d0d0d; border:1px solid #333; color:white; border-radius:6px; font-size:13px; }
.btn { background:var(--red); border:none; color:white; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:700; margin-top:10px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.status { font-size:13px; color:var(--green); margin-top:8px; }
.status.err { color:#ef4444; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:8px 6px; text-align:left; border-bottom:1px solid #2a2a2a; white-space:nowrap; }
th { color:var(--muted); font-weight:600; }
.pill { font-size:11px; font-weight:800; padding:3px 8px; border-radius:99px; }
.pill.active { background:#14372c; color:#22c55e; }
.pill.done { background:#2a2a2a; color:#a0a0a0; }
.reg { font-weight:700; color:var(--red); }
</style>
</head>
<body>
<h1>VISTA<span>JET</span> · Agente de Bitácora</h1>
<p class="sub">Prueba — obtiene vuelos de la organización VJG desde Infinite Flight API v3</p>

<div class="box">
  <label>Access Token de Infinite Flight (Bearer)</label>
  <input type="text" id="token" placeholder="Pega aquí el token de IF (o déjalo vacío si ya tienes sesión en el portal)">
  <button class="btn" id="btn" onclick="load()">Cargar vuelos de VJG</button>
  <div id="status" class="status"></div>
</div>

<div class="box" id="result" style="display:none">
  <div id="summary" style="margin-bottom:12px;font-size:14px"></div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Matrícula</th>
          <th>Ruta</th>
          <th>Estado</th>
          <th>Piloto</th>
          <th>Tiempo</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script>
const VJG_ORG_ID = '211f692c-6099-4289-ae6e-4d137880d976';
const API = 'https://api.infiniteflight.com/public/v3';

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (err ? ' err' : '');
}

async function load() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  setStatus('Consultando…');
  document.getElementById('result').style.display = 'none';

  let token = document.getElementById('token').value.trim();
  if (!token) token = localStorage.getItem('if_access_token') || '';
  // Try refresh if we have a refresh token
  const refresh = localStorage.getItem('if_refresh_token');
  if (refresh) {
    try {
      const r = await fetch('https://api.infiniteflight.com/auth/v2/connect/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'refresh_token',
          refresh_token: refresh,
          client_id: 'ifc_u3T5ked03Tovv6YxIQihXr9czDu42LSV'
        })
      });
      const data = await r.json();
      if (data.access_token) {
        token = data.access_token;
        localStorage.setItem('if_access_token', token);
        if (data.refresh_token) localStorage.setItem('if_refresh_token', data.refresh_token);
      }
    } catch(e) {}
  }
  if (!token) {
    setStatus('Sin token. Inicia sesión en el portal primero.', true);
    btn.disabled = false;
    return;
  }

  try {
    // 1. List orgs to confirm access
    const orgRes = await fetch(`${API}/live/organizations`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!orgRes.ok) throw new Error('Token inválido o vencido (' + orgRes.status + ')');
    const orgData = await orgRes.json();
    const orgs = orgData.result || [];
    const vjg = orgs.find(o => o.id === VJG_ORG_ID);
    if (!vjg) throw new Error('No perteneces a VistaJet Group');

    // 2. Aircraft in org
    const acRes = await fetch(`${API}/live/organizations/${VJG_ORG_ID}/aircraft`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const acData = await acRes.json();
    const aircraft = acData.result || [];

    // 3. Flights per aircraft
    const allFlights = [];
    for (const ac of aircraft.slice(0, 10)) {
      const flRes = await fetch(`${API}/live/aircraft/${ac.id}/flights?pageSize=3`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      const flData = await flRes.json();
      const items = (flData.result && flData.result.items) || [];
      items.forEach(f => {
        allFlights.push({
          ...f,
          registration: ac.registration || '—',
          pilot: (f.crew && f.crew.length) ? f.crew.map(c => c.username).join(', ') : '—'
        });
      });
    }

    allFlights.sort((a, b) => new Date(b.actualDepartureUtc || 0) - new Date(a.actualDepartureUtc || 0));

    // Render
    document.getElementById('summary').textContent =
      `${aircraft.length} aeronaves en VJG · ${allFlights.length} vuelos recientes`;
    const body = document.getElementById('body');
    body.innerHTML = allFlights.map(f => {
      const active = !f.actualArrivalUtc;
      const status = active ? '<span class="pill active">EN VUELO</span>' : '<span class="pill done">Completado</span>';
      const date = f.actualDepartureUtc ? new Date(f.actualDepartureUtc).toLocaleDateString() : '—';
      const route = `${f.originIcao || '?'} → ${f.destinationIcao || '?'}`;
      const time = f.flightTimeMinutes ? `${Math.floor(f.flightTimeMinutes/60)}h ${Math.round(f.flightTimeMinutes%60)}min` : '—';
      return `<tr>
        <td>${date}</td>
        <td class="reg">${f.registration}</td>
        <td>${route}</td>
        <td>${status}</td>
        <td>${f.pilot}</td>
        <td>${time}</td>
      </tr>`;
    }).join('');

    document.getElementById('result').style.display = 'block';
    setStatus('Listo');
  } catch(e) {
    setStatus('Error: ' + e.message, true);
  }
  btn.disabled = false;
}
</script>
</body>
</html>
